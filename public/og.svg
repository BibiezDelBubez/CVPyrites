<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CVPyrites — free, open-source, private resume builder" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#11141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5a12"/>
      <stop offset="0.5" stop-color="#d4982f"/>
      <stop offset="1" stop-color="#f7d774"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="12%" r="60%">
      <stop offset="0" stop-color="#d4982f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#d4982f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(90,86)">
    <svg width="84" height="84" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="128" fill="#17130c" stroke="#ffffff" stroke-opacity="0.16" stroke-width="8"/>
      <polygon points="106,176 176,106 406,106 336,176" fill="#f4d58a"/>
      <polygon points="336,176 406,106 406,336 336,406" fill="#a5701b"/>
      <polygon points="106,176 336,176 336,406 106,406" fill="#e2ad42"/>
      <line x1="146" y1="226" x2="296" y2="226" stroke="#17130c" stroke-width="16" stroke-linecap="round"/>
      <line x1="146" y1="269.3" x2="296" y2="269.3" stroke="#17130c" stroke-width="16" stroke-linecap="round"/>
      <line x1="146" y1="312.7" x2="296" y2="312.7" stroke="#17130c" stroke-width="16" stroke-linecap="round"/>
      <line x1="146" y1="356" x2="228.5" y2="356" stroke="#17130c" stroke-width="16" stroke-linecap="round"/>
      <line x1="184" y1="167" x2="236" y2="115" stroke="#17130c" stroke-opacity=".45" stroke-width="10" stroke-linecap="round"/>
      <line x1="230" y1="167" x2="282" y2="115" stroke="#17130c" stroke-opacity=".45" stroke-width="10" stroke-linecap="round"/>
      <line x1="276" y1="167" x2="328" y2="115" stroke="#17130c" stroke-opacity=".45" stroke-width="10" stroke-linecap="round"/>
      <line x1="360.5" y1="177.5" x2="360.5" y2="355.5" stroke="#17130c" stroke-opacity=".4" stroke-width="10" stroke-linecap="round"/>
      <line x1="381.5" y1="156.5" x2="381.5" y2="334.5" stroke="#17130c" stroke-opacity=".4" stroke-width="10" stroke-linecap="round"/>
    </svg>
    <text x="104" y="58" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f3f4f8">CV<tspan fill="#e0ab3e">Pyrites</tspan></text>
  </g>

  <!-- pill -->
  <g transform="translate(92,224)">
    <rect width="430" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="30" cy="23" r="6" fill="#39d98a"/>
    <text x="48" y="30" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#c9cdd8">Local-first · Free · Open source (MIT)</text>
  </g>

  <!-- headline -->
  <text x="90" y="350" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#f3f4f8">A beautiful resume that</text>
  <text x="90" y="426" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#f3f4f8">never leaves your <tspan fill="#e0ab3e">browser</tspan>.</text>

  <!-- subline -->
  <text x="92" y="486" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#9aa0ad">38 templates · built-in ATS · PDF import · PDF · Word · JSON · offline</text>

  <!-- footer -->
  <text x="92" y="566" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#e0ab3e">bibiezdelbubez.github.io/CVPyrites</text>
  <text x="526" y="566" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#6b7280">· no account · no tracking · your data stays with you</text>
</svg>
