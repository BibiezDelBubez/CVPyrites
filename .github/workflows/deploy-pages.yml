# Publishes CVPyrites to GitHub Pages on every push to main:
#   https://<user>.github.io/<repo>/
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The app is fully static and client-side: resumes stay in each visitor's browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # served from /<repo>/, not the domain root
          BASE_PATH: /${{ github.event.repository.name }}/
          # Pages can't send HTTP headers: put the CSP in a <meta> tag
          CSP_META: '1'
      # Deep links (/<repo>/resume/…) hit Pages' 404 page: make it the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v5
